<script>
const XIAOZHI_WS="ws://192.168.1.186:8000/xiaozhi/v1/";
const talkButton=document.getElementById("talkButton");
const statusText=document.getElementById("status");
const inputText=document.getElementById("inputText");
const responseText=document.getElementById("response");

let ws=null,recognition=null,isListening=false;

function connectXiaozhi(){
  ws=new WebSocket(XIAOZHI_WS);
  ws.binaryType="arraybuffer";

  ws.onopen=()=>{
    statusText.textContent="🟢 MIMI • XIAOZHI ONLINE";
    console.log("Xiaozhi WebSocket connected");
  };

  ws.onmessage=e=>{
    console.log("Xiaozhi:",e.data);

    if(typeof e.data==="string"){
      try{
        const data=JSON.parse(e.data);
        const text=data.text||data.reply||data.message||data.content;
        if(text){
          responseText.textContent=text;
          speak(text);
        }
      }catch{
        responseText.textContent=e.data;
      }
    }
  };

  ws.onerror=e=>{
    console.error("Xiaozhi WS error",e);
    statusText.textContent="❌ XIAOZHI WS ERROR";
  };

  ws.onclose=()=>{
    statusText.textContent="🔴 XIAOZHI OFFLINE";
    console.log("Xiaozhi WebSocket closed");
  };
}

function sendToXiaozhi(text){
  if(!ws||ws.readyState!==WebSocket.OPEN){
    statusText.textContent="❌ Chưa kết nối Xiaozhi";
    return;
  }

  const message={
    type:"listen",
    state:"start",
    text:text
  };

  ws.send(JSON.stringify(message));
  console.log("MIMI → Xiaozhi:",message);
}

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang="vi-VN";
  recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onstart=()=>{
    isListening=true;
    statusText.textContent="🎤 MIMI ĐANG NGHE...";
    talkButton.textContent="🎤 ĐANG NGHE";
  };

  recognition.onresult=e=>{
    const text=e.results[0][0].transcript.trim();
    if(!text)return;

    inputText.textContent=text;
    responseText.textContent="...";
    statusText.textContent="🤖 MIMI → XIAOZHI...";

    sendToXiaozhi(text);
  };

  recognition.onerror=e=>{
    console.error(e);
    statusText.textContent="❌ Micro: "+e.error;
    isListening=false;
    talkButton.textContent="🎤 NÓI VỚI MIMI";
  };

  recognition.onend=()=>{
    isListening=false;
    talkButton.textContent="🎤 NÓI VỚI MIMI";
  };
}

talkButton.onclick=()=>{
  if(!recognition)return;

  if(isListening){
    recognition.stop();
    return;
  }

  inputText.textContent="Mimi đang nghe...";
  recognition.start();
};

function speak(text){
  if(!("speechSynthesis"in window))return;

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang="vi-VN";
  u.rate=.95;
  u.onstart=()=>statusText.textContent="🔊 MIMI ĐANG NÓI...";
  u.onend=()=>statusText.textContent="🟢 MIMI • XIAOZHI ONLINE";

  speechSynthesis.speak(u);
}

connectXiaozhi();
</script>
