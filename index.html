<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MIMI PRO</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; min-height:100%; background:#05070a; color:#fff; font-family:Arial,sans-serif; }
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:18px; }
    .mimi { width:min(94vw,500px); text-align:center; }
    .hero {
      position:relative; width:100%; border-radius:28px; overflow:hidden;
      background:#05070a; box-shadow:0 0 50px rgba(114,82,255,.20);
    }
    .hero img { width:100%; display:block; height:auto; }
    .status {
      margin:14px 0 16px; color:#c8b8ff; font-size:16px;
      text-shadow:0 0 12px rgba(155,124,255,.8);
    }
    .talk {
      width:128px; height:128px; border-radius:50%; border:2px solid #9b7cff;
      background:#100d20; color:#fff; font-size:48px; cursor:pointer;
      box-shadow:0 0 28px #7255ff; transition:.15s;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .talk:active { transform:scale(.94); }
    .talk:disabled { opacity:.65; }
    .input,.response {
      margin-top:16px; padding:14px 16px; border-radius:15px;
      background:#0d1118; line-height:1.45;
    }
    .input { color:#aaa; min-height:50px; }
    .response { min-height:64px; font-size:17px; }
    @media (max-width:430px) {
      body { padding:10px; }
      .mimi { width:96vw; }
      .talk { width:112px; height:112px; font-size:42px; }
    }
  </style>
</head>

    <div class="status" id="status">MIMI PRO • ONLINE</div>

    <button class="talk" id="talkButton" type="button" aria-label="Nói với MIMI">🎤</button>

    <div class="input" id="inputText">Mimi đang chờ...</div>
    <div class="response" id="response">...</div>
  </main>

<script>
const WORKER_URL = "https://mimi-pro-core.tindhdt7.workers.dev/chat";

const talkButton = document.getElementById("talkButton");
const statusText = document.getElementById("status");
const inputText = document.getElementById("inputText");
const responseText = document.getElementById("response");

let recognition = null;
let isListening = false;
let isProcessing = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "vi-VN";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    statusText.textContent = "🎤 MIMI ĐANG NGHE...";
    talkButton.textContent = "⏹️";
  };

  recognition.onspeechstart = () => {
    statusText.textContent = "👂 MIMI ĐANG NGHE GIỌNG...";
  };

  recognition.onresult = async (event) => {
    let text = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    text = text.trim();
    if (!text) return;

    inputText.textContent = text;
    statusText.textContent = "🤖 MIMI ĐANG SUY NGHĨ...";
    isProcessing = true;
    talkButton.disabled = true;

    try {
      const result = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      if (!result.ok) {
        const errorText = await result.text();
        throw new Error("HTTP " + result.status + ": " + errorText);
      }

      const data = await result.json();
      const answer =
        data.reply || data.response || data.message || data.text ||
        "MIMI chưa có câu trả lời.";

      responseText.textContent = answer;
      speak(answer);
    } catch (error) {
      console.error("MIMI CORE ERROR:", error);
      responseText.textContent = "Lỗi MIMI Core: " + error.message;
      statusText.textContent = "❌ AI CORE ERROR";
    }

    isProcessing = false;
    talkButton.disabled = false;
    talkButton.textContent = "🎤";
  };

  recognition.onerror = (event) => {
    console.error("MIMI SPEECH ERROR:", event.error);
    isListening = false;

    if (event.error === "not-allowed") {
      statusText.textContent = "❌ iPhone chưa cho phép microphone";
    } else if (event.error === "service-not-allowed") {
      statusText.textContent = "❌ Safari chặn Speech Recognition";
    } else if (event.error === "no-speech") {
      statusText.textContent = "⚠️ MIMI không nghe thấy giọng nói";
    } else if (event.error === "network") {
      statusText.textContent = "❌ Speech Recognition lỗi mạng";
    } else {
      statusText.textContent = "❌ Speech: " + event.error;
    }

    inputText.textContent = "Hãy thử nói lại...";
    talkButton.disabled = false;
    talkButton.textContent = "🎤";
  };

  recognition.onend = () => {
    isListening = false;
    if (!isProcessing) {
      talkButton.disabled = false;
      talkButton.textContent = "🎤";
      statusText.textContent = "MIMI PRO • ONLINE";
    }
  };
} else {
  statusText.textContent = "❌ Trình duyệt không hỗ trợ Speech Recognition";
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusText.textContent = "⚠️ Thiết bị không hỗ trợ đọc tiếng";
    return;
  }

  const synth = window.speechSynthesis;
  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "vi-VN";
  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    statusText.textContent = "🔊 MIMI ĐANG NÓI...";
  };

  utterance.onend = () => {
    statusText.textContent = "MIMI PRO • ONLINE";
  };

  utterance.onerror = () => {
    statusText.textContent = "❌ MIMI không phát được loa";
  };

  synth.speak(utterance);
}

talkButton.addEventListener("click", () => {
  speechSynthesis.cancel();

  const unlockVoice = new SpeechSynthesisUtterance("");
  unlockVoice.volume = 0;
  speechSynthesis.speak(unlockVoice);

  if (!recognition) {
    statusText.textContent = "❌ Không có Speech Recognition";
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  inputText.textContent = "Mimi đang nghe...";
  responseText.textContent = "...";
  statusText.textContent = "🎤 MIMI ĐANG KHỞI ĐỘNG MICRO...";

  try {
    recognition.start();
  } catch (error) {
    console.error("Recognition start error:", error);
    statusText.textContent = "❌ Không thể bắt đầu microphone";
    talkButton.disabled = false;
  }
});
</script>
